<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Rock-paper-scissor</title>
      <link rel="stylesheet" href="12-rock-paper-scissor.css">
</head>
<body>

  <p class="title">Rock paper scissor</p>

  <button class="move-button js-rock-button"><img src="images/rock-emoji.png" class="move-icon"></button>  
        
  <button class="move-button js-papper-button"><img src="images/Papper-emoji.png" class="move-icon"></button>

  <button class="move-button js-Scissor-button"><img src="images/Scissor-emoji.png" class="move-icon"></button>

  <p class="js-result result"></p>
  <p class="js-moves"></p>
  <p class="js-score score"></p>

  <button class="reset-score-button js-reset-score-button">Reset Score</button>

  <button class="auto-play-button js-autoPlay">Autoplay</button>

  <p class="js-reset-confirmation cs-reset-confirmation "></p>

      <script src="12-rock-paper-scissor.js"></script>

</body>
</html>
